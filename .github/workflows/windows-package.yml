name: Build Windows portable package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        shell: pwsh
        run: .\build-windows.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: 三笙AI-商品开品闭环-Windows-最终安装包
          path: 三笙AI-商品开品闭环-Windows-最终安装包.zip
